
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:5000:5000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 5000

    restart: unless-stopped

    init: true

    stop_grace_period: 15s

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
